name: gauntlet

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Run smoke flow
        run: gauntlet run flows/smoke.yaml --workers 4
        env:
          GAUNTLET_SEED: "7"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-runs
          path: runs/
